# Spectra — CI Pipeline
# Runs on every pull request to dev or main.
# Jobs: backend tests, frontend tests, linting.
# Does NOT deploy — deployment is only on push to main.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  # ── Backend: lint + test ─────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      # Spin up real Postgres for integration tests
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: spectra_test
          POSTGRES_USER: spectra
          POSTGRES_PASSWORD: spectra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://spectra:spectra@localhost:5432/spectra_test
      REDIS_URL: redis://localhost:6379
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: spectra123
      JWT_SECRET_KEY: ci-test-secret-key-not-production
      ENVIRONMENT: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        working-directory: .

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check backend/app/ backend/tests/ --ignore E501
        working-directory: .

      - name: Run backend unit tests
        run: pytest tests/unit/ -v --tb=short
        working-directory: backend

  # ── Frontend: lint + test ─────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint with ESLint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0
        working-directory: frontend
        # Don't fail CI if ESLint config is missing — it's a warning only
        continue-on-error: true

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend
        env:
          # Vitest needs a dummy API URL even in test mode
          VITE_API_BASE_URL: http://localhost:8000
