# Spectra — Deploy Pipeline
# Triggered on push to main (after a PR is merged from dev → main).
# Deploys backend to Render and frontend to Vercel.
#
# Required GitHub Secrets (set in repo Settings → Secrets → Actions):
#   RENDER_DEPLOY_HOOK_URL   - from Render service → Settings → Deploy Hook
#   VERCEL_TOKEN             - from vercel.com/account/tokens
#   VERCEL_ORG_ID            - from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID        - from .vercel/project.json after `vercel link`

name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Re-run CI before deploying ────────────────────────────────────────────────
  test:
    name: Pre-deploy Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: spectra_test
          POSTGRES_USER: spectra
          POSTGRES_PASSWORD: spectra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://spectra:spectra@localhost:5432/spectra_test
      REDIS_URL: redis://localhost:6379
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: spectra123
      JWT_SECRET_KEY: ci-pre-deploy-secret-not-production
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest tests/unit/ -v --tb=short
        working-directory: backend

  # ── Deploy backend to Render ──────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: test  # only deploy if tests pass

    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Deploy ID:', d.get('deploy',{}).get('id','unknown'))"

      - name: Wait for Render deploy (health poll)
        # Poll /health for up to 3 minutes after triggering deploy
        run: |
          echo "Polling /health for up to 180s..."
          for i in $(seq 1 18); do
            sleep 10
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ vars.BACKEND_URL }}/health" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
          done
          echo "⚠️  Backend did not become healthy in 180s (may still be starting)"
        # Don't fail the workflow if health check doesn't pass — Render may be slow
        continue-on-error: true

  # ── Deploy frontend to Vercel ─────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: test  # only deploy if tests pass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (production)
        run: |
          vercel --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --cwd frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
