# Spectra Frontend — nginx configuration
# Enables React Router's HTML5 history mode: any unmatched path
# returns index.html so the SPA handles client-side routing.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long cache TTL
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — forward /api requests to the backend container
    location /api/ {
        proxy_pass http://spectra-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
